[project]
name = "macinterp-60482"
version = "0.1.0"
description = "Hypothesis triage for the Pythia-1.4B state-60482 effect"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "accelerate",
    "huggingface_hub",
    "numpy>=1.24",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
m60482 = "m60482.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["m60482"]

[tool.pytest.ini_options]
testpaths = ["tests"]
